apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: "7.3.2"
    helm:
      valuesObject:
        command:
          - "/opt/keycloak/bin/kc.sh"
        args:
          - "start-dev"
          - "--import-realm"
        extraEnv: |
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            value: admin
          - name: KC_HOSTNAME
            value: https://keycloak.local:8443
        proxy:
          mode: xforwarded
        http:
          relativePath: "/"
        extraVolumes: |
          - name: realm-config
            configMap:
              name: keycloak-realm
        extraVolumeMounts: |
          - name: realm-config
            mountPath: /opt/keycloak/data/import
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true