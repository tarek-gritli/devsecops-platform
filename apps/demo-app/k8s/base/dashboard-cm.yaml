apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-red-dashboard
  labels:
    grafana_dashboard: "1"
data:
  demo-app-red.json: |
    {
      "title": "Demo App - RED",
      "uid": "demo-app-red",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Rate (req/s by handler)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"demo-app-dev\"}[5m])) by (handler)",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Errors (5xx % by handler)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{namespace=\"demo-app-dev\", status=~\"5..\"}[5m])) by (handler) / sum(rate(http_requests_total{namespace=\"demo-app-dev\"}[5m])) by (handler)",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Duration (p95 by handler)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"demo-app-dev\"}[5m])) by (le, handler))",
              "legendFormat": "{{handler}}"
            }
          ]
        }
      ]
    }
